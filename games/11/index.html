<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bamboo Brawl</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="world" aria-label="First person bamboo valley game"></canvas>
<header><div class="brand"><canvas data-icon="fruit"></canvas><div>BAMBOO<br><b>BRAWL</b></div></div><div class="wave"><span class="light"></span><span id="wave">WAVE 01</span><i></i><span id="count">3 PANDAS</span></div><button id="pause" aria-label="Pause">Ⅱ</button></header>
<div class="vitals"><span id="hearts"></span><small id="hp">100 HP</small></div><div class="cross">+</div><div id="flash"></div>
<div id="touch"><div id="stick"><div></div></div><div class="actions"><button id="jump">↑</button><button id="place">▦</button><button id="hit">⚔</button></div></div>
<section class="belt"><div id="item"></div><div id="slots"></div></section>
<footer><span><kbd>WASD</kbd> Move</span><span><kbd>SPACE</kbd> Jump</span><span><kbd>LMB</kbd> Use / Break</span><span><kbd>RMB</kbd> Place</span><span><kbd>1–5</kbd> Hotbar</span><span><kbd>ESC</kbd> Pause</span></footer>
<dialog id="menu"><h1 id="mt">PAUSED</h1><p id="md">Bamboo Brawl</p><button id="resume">Resume game</button></dialog><script src="game.js"></script></body></html>
